<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripSplit - Shared Expense Tracker</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F9FAFB;
      --card: #FFFFFF;
      --text: #111827;
      --text-muted: #6B7280;
      --border: #E5E7EB;
      --success: #10B981;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    h1, h2, h3 { margin: 0 0 12px 0; font-weight: 700; }
    h2 { font-size: 1.15rem; color: #1F2937; }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }

    input, select, button {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .row-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-add-sm {
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-primary:hover { background-color: var(--primary-hover); }

    /* Requirement 1 & 3: Member Tags with X Button */
    .member-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .member-tag {
      background: #F3F4F6;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .member-tag .btn-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: bold;
      cursor: pointer;
      padding: 0;
      width: auto;
      font-size: 0.9rem;
    }

    .member-tag .btn-remove:hover { color: var(--danger); }

    /* Requirement 1: Beautified Split Chips */
    .chips-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

    .chip {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #F9FAFB;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      transition: all 0.2s ease;
    }

    .chip.on {
      background: #EEF2FF;
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    .chip input[type="checkbox"] { display: none; }

    .split-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }

    .stab {
      padding: 6px 12px;
      border-radius: 6px;
      background: #F3F4F6;
      border: none;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      width: auto;
    }

    .stab.act { background: var(--primary); color: white; }

    .split-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }

    .split-val-inp { width: 100px; text-align: right; }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .list-item:last-child { border-bottom: none; }

    .total-banner {
      background: #EEF2FF;
      color: var(--primary);
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 1.15rem;
    }

    .subtitle { font-size: 0.8rem; color: var(--text-muted); }
    
    /* Requirement 2: Non-bold italic item notes */
    .debt-item-note {
      font-style: italic;
      font-weight: normal !important;
      color: var(--text-muted);
      font-size: 0.82rem;
      display: block;
      margin-top: 2px;
    }

    /* Requirement 5: Google Maps Link button */
    .map-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.8rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .map-link:hover { text-decoration: underline; }

    /* Modal for custom category */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>✈️ TripSplit</h1>

  <!-- Trip Management Card -->
  <div class="card">
    <h2>Trip Setup</h2>
    
    <div class="input-group">
      <label>Add Member</label>
      <div class="row-group">
        <input type="text" id="new-member-input" placeholder="e.g. Alex" onkeydown="if(event.key==='Enter') addMember()">
        <button class="btn-add-sm" onclick="addMember()">+</button>
      </div>
      <!-- Requirement 3: Member list tags with X buttons -->
      <div id="member-tags-container" class="member-tags"></div>
    </div>

    <div class="input-group">
      <label for="trip-curr">Main Currency</label>
      <select id="trip-curr" onchange="renderTrip()">
        <option value="MYR">MYR (RM)</option>
        <option value="USD">USD ($)</option>
        <option value="EUR">EUR (€)</option>
        <option value="THB">THB (฿)</option>
        <option value="VND">VND (₫)</option>
      </select>
    </div>
  </div>

  <!-- Total Spend Summary Banner -->
  <div class="total-banner">
    Total Spent: <span id="total-curr">MYR</span> <span id="total-val">0.00</span>
  </div>

  <!-- Add Expense Card -->
  <div class="card">
    <h2>Add Expense</h2>
    
    <div class="input-group">
      <label for="exp-title">Description</label>
      <input type="text" id="exp-title" placeholder="e.g. Dinner at Night Market">
    </div>

    <!-- Requirement 3: Default show 0.00 -->
    <div class="input-group">
      <label for="exp-amount">Amount</label>
      <input type="number" id="exp-amount" value="0.00" step="0.01" min="0" onfocus="if(this.value==='0.00') this.value=''">
    </div>

    <div class="input-group">
      <label for="exp-payer">Paid By</label>
      <select id="exp-payer"></select>
    </div>

    <!-- Requirement 6: Category button with small '+' popup -->
    <div class="input-group">
      <label for="exp-cat">Category</label>
      <div class="row-group">
        <select id="exp-cat"></select>
        <button class="btn-add-sm" type="button" onclick="openCategoryModal()" title="Add Custom Category">+</button>
      </div>
    </div>

    <div class="input-group">
      <label>Split Mode</label>
      <div class="split-tabs">
        <button class="stab act" onclick="setSplitMode('equal', this)">Equal</button>
        <button class="stab" onclick="setSplitMode('unequal', this)">Exact</button>
        <button class="stab" onclick="setSplitMode('percent', this)">Percent</button>
        <button class="stab" onclick="setSplitMode('shares', this)">Shares</button>
      </div>
    </div>

    <!-- Requirement 1: Beautified Split Mode UI -->
    <div id="split-equal-ui">
      <label>Split Among</label>
      <div id="split-chips" class="chips-container"></div>
    </div>

    <div id="split-custom-ui" style="display: none;">
      <label id="custom-lbl">Custom Split</label>
      <div id="split-custom-grid"></div>
    </div>

    <button class="btn-primary" onclick="addExpense()">Add Expense</button>
  </div>

  <!-- Requirement 4: Swapped Order - 1st Expense History -->
  <div class="card">
    <h2>Expense History</h2>
    <div id="expense-list"></div>
  </div>

  <!-- Requirement 4: Swapped Order - 2nd New Feature: Category Analytics & Settlement -->
  <div class="card">
    <h2>Category Spend Analysis</h2>
    <div id="category-analytics"></div>
  </div>

  <!-- Requirement 2: Balances with non-bold italic item notes -->
  <div class="card">
    <h2>Balances & Settlement</h2>
    <div id="balances-list"></div>
  </div>

  <!-- Requirement 5: Places & Google Maps links -->
  <div class="card">
    <h2>Saved Places & Maps</h2>
    <div class="input-group">
      <div class="row-group">
        <input type="text" id="place-input" placeholder="e.g. Ben Thanh Market, Saigon">
        <button class="btn-add-sm" onclick="addPlace()">+</button>
      </div>
    </div>
    <div id="places-list"></div>
  </div>

  <!-- Requirement 7: Replaced notes with Data Export & Sync Engine Status -->
  <div class="card">
    <h2>Data Engine & Trip Backup</h2>
    <p class="subtitle" style="margin-bottom: 12px;">App state automatically syncs locally and generates instant exports for group sharing.</p>
    <div class="row-group">
      <button class="btn-primary" style="margin-top:0;" onclick="exportCSV()">Export to CSV</button>
      <button class="btn-primary" style="margin-top:0; background:#374151;" onclick="clearTripData()">Reset Trip Data</button>
    </div>
  </div>
</div>

<!-- Requirement 6: Custom Category Popup Modal -->
<div id="cat-modal" class="modal-overlay">
  <div class="modal">
    <h3>Add Custom Category</h3>
    <div class="input-group">
      <label for="custom-cat-input">Category Name</label>
      <input type="text" id="custom-cat-input" placeholder="e.g. Massages, Fuel, Sightseeing">
    </div>
    <div class="row-group" style="margin-top: 12px;">
      <button class="btn-primary" onclick="saveCustomCategory()">Add Category</button>
      <button class="btn-primary" style="background:#6B7280;" onclick="closeCategoryModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ── GLOBAL STATE ── */
let activeTripId = 'default-trip';
let splitMode = 'equal';

let categories = ['Food & Dining', 'Transport', 'Accommodation', 'Entertainment', 'Shopping', 'General'];

let membersList = ['Alex', 'Kiren', 'Sarah', 'Bhagat'];

let placesList = [];

let allTrips = [{
  id: 'default-trip',
  mainCurrency: 'MYR',
  expenses: []
}];

/* ── INITIALIZATION ── */
window.onload = function() {
  loadFromStorage();
  renderCategories();
  renderTrip();
};

/* ── MEMBER MANAGEMENT (Requirement 3) ── */
function addMember() {
  const input = document.getElementById('new-member-input');
  const name = input.value.trim();
  if (name && !membersList.includes(name)) {
    membersList.push(name);
    input.value = '';
    renderTrip();
  }
}

function removeMember(name) {
  membersList = membersList.filter(m => m !== name);
  renderTrip();
}

function renderMemberTags() {
  const container = document.getElementById('member-tags-container');
  container.innerHTML = membersList.map(m => `
    <span class="member-tag">
      ${escapeHtml(m)}
      <button class="btn-remove" onclick="removeMember('${escapeHtml(m)}')">✕</button>
    </span>
  `).join('');
}

/* ── CATEGORY MODAL (Requirement 6) ── */
function renderCategories() {
  const select = document.getElementById('exp-cat');
  select.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
}

function openCategoryModal() {
  document.getElementById('cat-modal').style.display = 'flex';
  document.getElementById('custom-cat-input').focus();
}

function closeCategoryModal() {
  document.getElementById('cat-modal').style.display = 'none';
  document.getElementById('custom-cat-input').value = '';
}

function saveCustomCategory() {
  const catInput = document.getElementById('custom-cat-input').value.trim();
  if (catInput && !categories.includes(catInput)) {
    categories.push(catInput);
    renderCategories();
    document.getElementById('exp-cat').value = catInput;
  }
  closeCategoryModal();
}

/* ── MAIN RENDER ENGINE ── */
function renderTrip() {
  const trip = allTrips.find(t => t.id === activeTripId);
  if (!trip) return;

  trip.mainCurrency = document.getElementById('trip-curr').value;

  renderMemberTags();

  // Populate Payer Dropdown
  const payerSel = document.getElementById('exp-payer');
  const currPayer = payerSel.value || membersList[0] || '';
  payerSel.innerHTML = membersList.map(m => `
    <option value="${escapeHtml(m)}" ${m === currPayer ? 'selected' : ''}>${escapeHtml(m)}</option>
  `).join('');

  // Update Split Chips
  renderSplitUI();

  // Total Spending
  const totalSpent = (trip.expenses || []).reduce((sum, e) => sum + (e.amount || 0), 0);
  document.getElementById('total-val').innerText = totalSpent.toFixed(2);
  document.getElementById('total-curr').innerText = trip.mainCurrency || 'MYR';

  // Render Sub-sections
  renderExpenses();          // Req 4: First
  renderCategoryAnalytics(); // Req 4: Second (New)
  renderBalances();          // Req 2: Clear debt reasons with italics
  renderPlaces();            // Req 5: Maps link

  saveToStorage();
}

/* ── BEAUTIFIED SPLIT UI (Requirement 1) ── */
function renderSplitUI(forceRebuild = false) {
  if (splitMode === 'equal') {
    const container = document.getElementById('split-chips');
    if (!container.children.length || forceRebuild) {
      container.innerHTML = membersList.map(m => `
        <label class="chip on" onclick="toggleChip(this)">
          <input type="checkbox" value="${escapeHtml(m)}" checked>
          <span>✓</span> ${escapeHtml(m)}
        </label>
      `).join('');
    }
  } else if (['unequal', 'percent', 'shares'].includes(splitMode)) {
    const lbl = document.getElementById('custom-lbl');
    if (splitMode === 'unequal') lbl.innerText = "Exact amount per person";
    else if (splitMode === 'percent') lbl.innerText = "Percentage (%) per person";
    else if (splitMode === 'shares') lbl.innerText = "Number of shares per person";

    document.getElementById('split-custom-grid').innerHTML = membersList.map(m => `
      <div class="split-row">
        <span>${escapeHtml(m)}</span>
        <div>
          <input type="number" class="split-val-inp" data-member="${escapeHtml(m)}" placeholder="0.00" min="0" step="any">
          <span class="unit">${splitMode === 'percent' ? '%' : (splitMode === 'shares' ? 'sh' : '')}</span>
        </div>
      </div>
    `).join('');
  }
}

function toggleChip(chipLabel) {
  const checkbox = chipLabel.querySelector('input[type="checkbox"]');
  checkbox.checked = !checkbox.checked;
  chipLabel.classList.toggle('on', checkbox.checked);
  chipLabel.querySelector('span').innerText = checkbox.checked ? '✓' : '';
}

function setSplitMode(mode, btn) {
  splitMode = mode;
  document.querySelectorAll('.split-tabs .stab').forEach(b => b.classList.remove('act'));
  if (btn) btn.classList.add('act');

  document.getElementById('split-equal-ui').style.display = (mode === 'equal') ? 'block' : 'none';
  document.getElementById('split-custom-ui').style.display = (['unequal', 'percent', 'shares'].includes(mode)) ? 'block' : 'none';

  renderSplitUI(true);
}

/* ── ADD EXPENSE LOGIC ── */
function addExpense() {
  const trip = allTrips.find(t => t.id === activeTripId);
  const title = document.getElementById('exp-title').value.trim() || 'General Expense';
  const amount = parseFloat(document.getElementById('exp-amount').value);
  const payer = document.getElementById('exp-payer').value;
  const category = document.getElementById('exp-cat').value;

  if (isNaN(amount) || amount <= 0) {
    alert("Please enter a valid amount greater than 0.");
    return;
  }

  let splits = {};

  if (splitMode === 'equal') {
    const selectedChips = Array.from(document.querySelectorAll('#split-chips input[type="checkbox"]:checked'));
    const selectedMembers = selectedChips.map(c => c.value);

    if (selectedMembers.length === 0) {
      alert("Please select at least 1 person to split with.");
      return;
    }

    const share = amount / selectedMembers.length;
    selectedMembers.forEach(m => { splits[m] = share; });

  } else if (splitMode === 'unequal') {
    const inputs = document.querySelectorAll('#split-custom-grid .split-val-inp');
    inputs.forEach(inp => {
      const val = parseFloat(inp.value) || 0;
      if (val > 0) splits[inp.dataset.member] = val;
    });
  } else if (splitMode === 'percent') {
    const inputs = document.querySelectorAll('#split-custom-grid .split-val-inp');
    inputs.forEach(inp => {
      const pct = parseFloat(inp.value) || 0;
      if (pct > 0) splits[inp.dataset.member] = (amount * pct) / 100;
    });
  } else if (splitMode === 'shares') {
    const inputs = document.querySelectorAll('#split-custom-grid .split-val-inp');
    let totalShares = 0;
    inputs.forEach(inp => { totalShares += (parseFloat(inp.value) || 0); });
    
    if (totalShares > 0) {
      inputs.forEach(inp => {
        const sh = parseFloat(inp.value) || 0;
        if (sh > 0) splits[inp.dataset.member] = (amount * sh) / totalShares;
      });
    }
  }

  const newExpense = {
    id: 'exp-' + Date.now(),
    title,
    amount,
    payer,
    category,
    splits,
    splitMode,
    timestamp: new Date().toISOString()
  };

  trip.expenses.push(newExpense);

  // Reset Input fields to 0.00
  document.getElementById('exp-title').value = '';
  document.getElementById('exp-amount').value = '0.00';
  
  renderTrip();
}

/* ── REQUIREMENT 4: EXPENSES FIRST ── */
function renderExpenses() {
  const trip = allTrips.find(t => t.id === activeTripId);
  const container = document.getElementById('expense-list');

  if (!trip.expenses || trip.expenses.length === 0) {
    container.innerHTML = `<p class="subtitle">No expenses recorded yet.</p>`;
    return;
  }

  container.innerHTML = trip.expenses.slice().reverse().map(e => `
    <div class="list-item">
      <div>
        <strong>${escapeHtml(e.title)}</strong><br>
        <span class="subtitle">Paid by ${escapeHtml(e.payer)} • <em>${escapeHtml(e.category)}</em></span>
      </div>
      <div>
        <strong>${trip.mainCurrency} ${e.amount.toFixed(2)}</strong>
      </div>
    </div>
  `).join('');
}

/* ── REQUIREMENT 4: NEW CATEGORY SPEND ANALYTICS ── */
function renderCategoryAnalytics() {
  const trip = allTrips.find(t => t.id === activeTripId);
  const container = document.getElementById('category-analytics');

  if (!trip.expenses || trip.expenses.length === 0) {
    container.innerHTML = `<p class="subtitle">No data available yet.</p>`;
    return;
  }

  let catTotals = {};
  let totalSpent = 0;

  trip.expenses.forEach(e => {
    catTotals[e.category] = (catTotals[e.category] || 0) + e.amount;
    totalSpent += e.amount;
  });

  container.innerHTML = Object.keys(catTotals).map(cat => {
    const amt = catTotals[cat];
    const pct = totalSpent > 0 ? ((amt / totalSpent) * 100).toFixed(0) : 0;
    return `
      <div class="list-item">
        <div>
          <strong>${escapeHtml(cat)}</strong><br>
          <span class="subtitle">${pct}% of total spending</span>
        </div>
        <div>
          <strong>${trip.mainCurrency} ${amt.toFixed(2)}</strong>
        </div>
      </div>
    `;
  }).join('');
}

/* ── REQUIREMENT 2: BALANCES WITH NON-BOLD ITALIC ITEM DESCRIPTIONS ── */
function renderBalances() {
  const trip = allTrips.find(t => t.id === activeTripId);
  const container = document.getElementById('balances-list');

  if (!trip.expenses || trip.expenses.length === 0) {
    container.innerHTML = `<p class="subtitle">Balances are clean! No debts recorded.</p>`;
    return;
  }

  // Calculate pairwise debts and track items causing the debt
  let pairwise = {}; // { "Debtor->Creditor": { amount: 0, items: [] } }

  trip.expenses.forEach(e => {
    const payer = e.payer;
    if (!e.splits) return;

    Object.keys(e.splits).forEach(member => {
      if (member !== payer) {
        const owedAmount = e.splits[member];
        if (owedAmount > 0) {
          const key = `${member}->${payer}`;
          if (!pairwise[key]) pairwise[key] = { amount: 0, items: [] };
          pairwise[key].amount += owedAmount;
          if (!pairwise[key].items.includes(e.title)) {
            pairwise[key].items.push(e.title);
          }
        }
      }
    });
  });

  // Simplify net debts between pairs
  let netDebts = [];
  let processedPairs = new Set();

  Object.keys(pairwise).forEach(key => {
    if (processedPairs.has(key)) return;

    const [debtor, creditor] = key.split('->');
    const reverseKey = `${creditor}->${debtor}`;

    const forward = pairwise[key] || { amount: 0, items: [] };
    const reverse = pairwise[reverseKey] || { amount: 0, items: [] };

    processedPairs.add(key);
    processedPairs.add(reverseKey);

    const diff = forward.amount - reverse.amount;

    if (diff > 0) {
      netDebts.push({
        from: debtor,
        to: creditor,
        amount: diff,
        items: forward.items
      });
    } else if (diff < 0) {
      netDebts.push({
        from: creditor,
        to: debtor,
        amount: Math.abs(diff),
        items: reverse.items
      });
    }
  });

  if (netDebts.length === 0) {
    container.innerHTML = `<p class="subtitle">All settled up!</p>`;
    return;
  }

  container.innerHTML = netDebts.map(d => {
    const itemsText = d.items.length ? d.items.join(', ') : 'Shared Expenses';
    return `
      <div class="list-item">
        <div>
          <span><strong>${escapeHtml(d.from)}</strong> owes <strong>${escapeHtml(d.to)}</strong></span>
          <!-- Non-bold italic description note -->
          <span class="debt-item-note">for <i>${escapeHtml(itemsText)}</i></span>
        </div>
        <div style="color: var(--danger); font-weight: bold;">
          ${trip.mainCurrency} ${d.amount.toFixed(2)}
        </div>
      </div>
    `;
  }).join('');
}

/* ── REQUIREMENT 5: PLACES WITH GOOGLE MAPS LINK ── */
function addPlace() {
  const input = document.getElementById('place-input');
  const place = input.value.trim();
  if (place && !placesList.includes(place)) {
    placesList.push(place);
    input.value = '';
    renderPlaces();
    saveToStorage();
  }
}

function removePlace(index) {
  placesList.splice(index, 1);
  renderPlaces();
  saveToStorage();
}

function renderPlaces() {
  const container = document.getElementById('places-list');
  if (placesList.length === 0) {
    container.innerHTML = `<p class="subtitle">No places saved for this trip yet.</p>`;
    return;
  }

  container.innerHTML = placesList.map((p, idx) => {
    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p)}`;
    return `
      <div class="list-item">
        <div>
          <strong>📍 ${escapeHtml(p)}</strong><br>
          <a class="map-link" href="${mapUrl}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
        </div>
        <button class="btn-remove" style="width:auto; border:none; background:none; cursor:pointer;" onclick="removePlace(${idx})">✕</button>
      </div>
    `;
  }).join('');
}

/* ── REQUIREMENT 7: DATA ENGINE & EXPORT ── */
function exportCSV() {
  const trip = allTrips.find(t => t.id === activeTripId);
  if (!trip.expenses || trip.expenses.length === 0) {
    alert("No expense data available to export.");
    return;
  }

  let csv = "Description,Amount,Currency,PaidBy,Category,Date\n";
  trip.expenses.forEach(e => {
    csv += `"${e.title}",${e.amount},${trip.mainCurrency},"${e.payer}","${e.category}","${e.timestamp}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.setAttribute('href', url);
  a.setAttribute('download', `TripSplit_Export_${Date.now()}.csv`);
  a.click();
}

function clearTripData() {
  if (confirm("Are you sure you want to reset all expense data for this trip?")) {
    allTrips = [{ id: 'default-trip', mainCurrency: 'MYR', expenses: [] }];
    placesList = [];
    renderTrip();
  }
}

/* ── STORAGE ── */
function saveToStorage() {
  localStorage.setItem('tripsplit_data', JSON.stringify(allTrips));
  localStorage.setItem('tripsplit_members', JSON.stringify(membersList));
  localStorage.setItem('tripsplit_places', JSON.stringify(placesList));
  localStorage.setItem('tripsplit_cats', JSON.stringify(categories));
}

function loadFromStorage() {
  const savedTrips = localStorage.getItem('tripsplit_data');
  const savedMembers = localStorage.getItem('tripsplit_members');
  const savedPlaces = localStorage.getItem('tripsplit_places');
  const savedCats = localStorage.getItem('tripsplit_cats');

  if (savedTrips) try { allTrips = JSON.parse(savedTrips); } catch(e){}
  if (savedMembers) try { membersList = JSON.parse(savedMembers); } catch(e){}
  if (savedPlaces) try { placesList = JSON.parse(savedPlaces); } catch(e){}
  if (savedCats) try { categories = JSON.parse(savedCats); } catch(e){}
}
</script>
